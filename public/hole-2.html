<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Glendower · Hole 2 — Flythrough</title>
<meta name="description" content="Fly the 2nd at Glendower Golf Club in live 3D. M2M Charity Golf Day.">
<meta name="theme-color" content="#0E1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0E1116;color:#D7D9DC;font-family:Archivo,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  a{color:#EEF0F1;text-decoration:none}
  a:hover{color:#C8102E}
  ::selection{background:#C8102E;color:#FFFDFC}
  button{font-family:inherit;color:inherit}
  button:focus-visible,a:focus-visible{outline:1px solid #C8102E;outline-offset:3px}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (max-width:820px){[data-spec]{display:none}}
  @media (max-width:560px){
    [data-hint]{display:none}
    header{padding-left:max(14px,env(safe-area-inset-left))!important;padding-right:max(14px,env(safe-area-inset-right))!important}
    h1{font-size:clamp(42px,17vw,76px)!important}
  }
  @media (max-height:520px){
    [data-spec],[data-hint]{display:none}
    h1{font-size:clamp(38px,12vh,60px)!important}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>

<div style="position:fixed;inset:0;background:#0E1116;overflow:hidden">

  <x-import component-from-global-scope="golf-stage" from="./golf-3d.js" mode="explore" hint-size="100%,100%" style="position:absolute;inset:0;width:100%;height:100%"></x-import>

  <div aria-hidden="true" style="position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 80% at 50% 45%,transparent 42%,rgba(14,17,22,.55) 100%)"></div>
  <div aria-hidden="true" style="position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:overlay;opacity:.16;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%22.85%22 numOctaves=%224%22 stitchTiles=%22stitch%22/></filter><rect width=%22160%22 height=%22160%22 filter=%22url(%23n%22)%22/></svg>')"></div>

  <!-- top bar -->
  <header style="position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(14px,2vw,26px) clamp(16px,3vw,40px);background:linear-gradient(180deg,rgba(14,17,22,.92),transparent);animation:fade .8s ease both">
    <a href="/" style="display:inline-flex;align-items:center;gap:12px;font:500 clamp(9px,.76vw,11px)/1 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#D7D9DC;white-space:nowrap" style-hover="color:#FFFDFC">
      <span style="color:#C8102E;font-size:1.2em;line-height:0">&#8592;</span>
      Back to entries
    </a>
    <div style="display:flex;align-items:center;gap:clamp(10px,1.4vw,18px);min-width:0">
      <img src="assets/m2m-logo.png" alt="Marketing 2 The Max" style="height:clamp(16px,1.9vw,22px);width:auto;display:block;filter:brightness(1.5)">
      <span aria-hidden="true" style="width:1px;height:22px;background:rgba(215,217,220,.22)"></span>
      <img src="https://glendower.co.za/resources/GLENDOWER/www/wp-content/uploads/glendower-logo.png" alt="Glendower Golf Club" onError="{{ imgFail }}" style="height:clamp(20px,2.4vw,28px);width:auto;display:block;filter:brightness(0) invert(1) opacity(.82)">
    </div>
  </header>

  <!-- hole identity, top left -->
  <div style="position:absolute;z-index:4;left:clamp(16px,3vw,40px);top:clamp(66px,10vh,104px);pointer-events:none;animation:rise .9s cubic-bezier(.16,1,.3,1) .1s both">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:clamp(10px,1.6vh,18px)">
      <span style="width:clamp(22px,3vw,44px);height:1px;background:#C8102E;transform-origin:left;animation:wipe .9s cubic-bezier(.16,1,.3,1) .3s both"></span>
      <span style="font:500 clamp(8.5px,.72vw,10.5px)/1 'JetBrains Mono',monospace;letter-spacing:.28em;text-transform:uppercase;color:#C8102E">Glendower Golf Club</span>
    </div>
    <h1 style="margin:0;font-family:Archivo,sans-serif;font-variation-settings:'wdth' 118,'wght' 800;font-size:clamp(40px,8vw,132px);line-height:.82;letter-spacing:-.04em;text-transform:uppercase;color:#FFFDFC;text-shadow:0 8px 40px rgba(14,17,22,.7)">
      The <em style="font-family:'Instrument Serif',serif;font-style:italic;font-variation-settings:normal;font-weight:400;text-transform:none;letter-spacing:-.02em;color:#C8102E">2nd</em>
    </h1>
    <p style="margin:clamp(12px,2vh,20px) 0 0;max-width:34ch;font-size:clamp(13px,1.05vw,16px);line-height:1.55;color:#aeb4bc;text-shadow:0 2px 14px rgba(14,17,22,.9);text-wrap:pretty">{{ note }}</p>
  </div>

  <!-- spec card, right -->
  <div data-spec="true" style="position:absolute;z-index:4;right:clamp(16px,3vw,40px);top:clamp(66px,10vh,104px);width:clamp(180px,17vw,236px);border:1px solid rgba(215,217,220,.16);background:rgba(20,23,27,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .9s cubic-bezier(.16,1,.3,1) .24s both">
    <div style="padding:14px 16px;border-bottom:1px solid rgba(215,217,220,.14);font:500 8.5px/1 'JetBrains Mono',monospace;letter-spacing:.26em;text-transform:uppercase;color:#7c828a">Card</div>
    <sc-for list="{{ spec }}" as="s" hint-placeholder-count="3">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(215,217,220,.08)">
        <span style="font:400 9px/1 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#8f959d">{{ s.k }}</span>
        <span style="font-family:Archivo,sans-serif;font-variation-settings:'wdth' 110,'wght' 700;font-size:clamp(15px,1.5vw,21px);line-height:1;letter-spacing:-.02em;color:#EEF0F1;font-variant-numeric:tabular-nums">{{ s.v }}</span>
      </div>
    </sc-for>
    <div style="padding:12px 16px;font:400 9px/1.6 'JetBrains Mono',monospace;letter-spacing:.06em;color:#5f656d">Interpretive model &mdash; not a survey</div>
  </div>

  <!-- controls -->
  <div style="position:absolute;z-index:4;left:0;right:0;bottom:0;padding:clamp(16px,2.6vh,30px) clamp(16px,3vw,40px) clamp(18px,3vh,34px);background:linear-gradient(0deg,rgba(14,17,22,.94),rgba(14,17,22,.5) 55%,transparent);animation:fade 1s ease .4s both">

    <div style="max-width:1500px;margin:0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:clamp(10px,1.4vw,18px)">
      <button type="button" onClick="{{ toggleFly }}" style="position:relative;display:inline-flex;align-items:center;gap:clamp(12px,1.4vw,18px);padding:clamp(14px,1.5vw,19px) clamp(20px,2.2vw,30px);background:#C8102E;border:0;cursor:pointer;font:700 clamp(10px,.84vw,12.5px)/1 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#FFFDFC;clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);box-shadow:0 16px 44px -18px rgba(200,16,46,.9);transition:background .3s ease,transform .3s ease" style-hover="background:#A70B24;transform:translateY(-2px)">
        <span style="font-size:1.05em;line-height:0">{{ flyGlyph }}</span>
        {{ flyLabel }}
      </button>

      <button type="button" onClick="{{ reset }}" style="display:inline-flex;align-items:center;gap:11px;padding:clamp(14px,1.5vw,19px) clamp(16px,1.9vw,24px);background:rgba(20,23,27,.6);border:1px solid rgba(215,217,220,.22);cursor:pointer;font:500 clamp(10px,.84vw,12.5px)/1 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#D7D9DC;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .3s ease,color .3s ease,background .3s ease" style-hover="border-color:#D7D9DC;color:#FFFDFC;background:rgba(215,217,220,.08)">
        Reset view
      </button>

      <div data-hint="true" style="display:flex;flex-direction:column;gap:6px;margin-left:auto;text-align:right">
        <span style="font:400 9px/1 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#9aa0a8">Drag to orbit &middot; scroll to zoom</span>
        <span style="font:400 9px/1 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5f656d">Tee &rarr; green, {{ flySeconds }}s</span>
      </div>
    </div>

    <!-- flight progress -->
    <div style="max-width:1500px;margin:clamp(14px,2vh,22px) auto 0">
      <div style="position:relative;height:2px;background:rgba(215,217,220,.16)">
        <div style="position:absolute;left:0;top:0;bottom:0;background:#C8102E;transition:width .12s linear;width:{{ progressPct }}"></div>
        <div style="position:absolute;top:-3px;bottom:-3px;width:2px;background:#EEF0F1;transition:left .12s linear;left:{{ progressPct }}"></div>
      </div>
      <div style="display:flex;justify-content:space-between;gap:14px;margin-top:10px;font:400 8.5px/1 'JetBrains Mono',monospace;letter-spacing:.24em;text-transform:uppercase;color:#5f656d">
        <span>Tee</span>
        <span>Fairway</span>
        <span>Green</span>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;holeNumber&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:18,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Hole&quot;},&quot;holePar&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hole&quot;},&quot;holeLength&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hole&quot;},&quot;holeIndex&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hole&quot;},&quot;holeNote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hole&quot;}}">
class Component extends DCLogic {
  state = { flying: false, progress: 0 };

  componentDidMount() {
    const attach = () => {
      const el = document.querySelector('golf-stage');
      if (!el || !el.startFlythrough) { this._t = setTimeout(attach, 200); return; }
      this._stage = el;
      el.addEventListener('flystate', e => this.setState({ flying: e.detail.flying, progress: e.detail.flying ? 0 : this.state.progress }));
      el.addEventListener('flyprogress', e => {
        const p = e.detail.progress;
        // repaint the bar in ~1% steps rather than every frame
        if (Math.abs(p - this.state.progress) > 0.008 || p >= 1) this.setState({ progress: p });
      });
      this._key = ev => {
        if (ev.key === ' ') { ev.preventDefault(); this.toggle(); }
        if (ev.key === 'r' || ev.key === 'R') el.resetView();
      };
      window.addEventListener('keydown', this._key);
    };
    attach();
  }

  componentWillUnmount() {
    clearTimeout(this._t);
    if (this._key) window.removeEventListener('keydown', this._key);
  }

  toggle = () => {
    const el = this._stage || document.querySelector('golf-stage');
    if (!el || !el.startFlythrough) return;
    this.state.flying ? el.stopFlythrough() : el.startFlythrough();
  };

  reset = () => {
    const el = this._stage || document.querySelector('golf-stage');
    if (el && el.resetView) { el.resetView(); this.setState({ progress: 0 }); }
  };

  renderVals() {
    const dash = '\u2014';
    const spec = [
      { k: 'Hole', v: String(this.props.holeNumber ?? 2) },
      { k: 'Par', v: this.props.holePar || dash },
      { k: 'Length', v: this.props.holeLength || dash },
      { k: 'Stroke', v: this.props.holeIndex || dash }
    ];
    return {
      spec,
      note: this.props.holeNote ||
        'A parkland hole in the Glendower mould \u2014 tree-lined off the tee, bunkering that makes you choose a side, and a green that gives nothing away. Fly it before you play it.',
      flying: this.state.flying,
      flyLabel: this.state.flying ? 'Stop flythrough' : 'Fly the hole',
      flyGlyph: this.state.flying ? '\u25A0' : '\u25B6',
      flySeconds: 26,
      progressPct: `${Math.round(this.state.progress * 100)}%`,
      toggleFly: this.toggle,
      reset: this.reset,
      imgFail: e => { e.target.style.opacity = '0'; }
    };
  }
}

</script>
</body>
</html>
